<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chicago Rp</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <div class="marca">
      <img src="/images/logo-header.png" alt="Chicago Rp" />
      <span>Chicago Rp</span>
    </div>
    <nav id="nav-derecha">
      <!-- Se llena con JavaScript segun si hay sesion o no -->
    </nav>
  </header>

  <main>
    <div id="aviso"></div>
    <div id="contenido">
      <!-- Se llena con JavaScript -->
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("acceso") === "denegado") {
      document.getElementById("aviso").innerHTML =
        '<div class="aviso-error">No tienes el rol necesario para ver esa sección.</div>';
    }

    async function cargar() {
      const nav = document.getElementById("nav-derecha");
      const contenido = document.getElementById("contenido");

      let sesion = { loggedIn: false };
      try {
        const res = await fetch("/api/me");
        sesion = await res.json();
      } catch (e) {
        sesion = { loggedIn: false };
      }

      if (!sesion.loggedIn) {
        nav.innerHTML = "";
        contenido.innerHTML = `
          <div class="card">
            <h1>Bienvenido a Chicago Rp</h1>
            <p class="muted">Hola Bienbenido al portal Digital de CHICAGO RP, aca podras ver información general del servidor.</p>
            <p>Debes iniciar sesión con tu cuenta de Discord para poder acceder al portal de Chicago.</p>
            <a class="btn" href="/api/login">Iniciar sesión</a>
          </div>
          <div class="card">
            <h2>Información del Servidor:</h2>
            <p>En este portal podras ver toda la informacion que tenemos para ti.</p>
            <p>Si eres policía podra ver la infotmacion de (Arrestos, multas, Base de datos).</p>
            <p>Si en cambio eres criminal podras ver toda la categoria e informacion criminal (Regristrar una banda etc...).</p>
            <p>O si eres un ciudadano puedes ver a los ciudadanos que estan en busqueda y captura, registrar su empresa y registrar su datos etc...</p>
           </div>
        `;
      } else {
        nav.innerHTML = `<a href="/api/logout">Cerrar sesión</a>`;
        contenido.innerHTML = `
          <div class="card centro">
            <h1>Bienvenid@, ${sesion.username}</h1>
            <p class="muted">¿A dónde quieres dirigirte? Elige una sección..</p>
          </div>
          <div class="secciones-grid">
            <a class="seccion-cuadro" href="/civil/">
              <div class="icono">🧑</div>
              <div class="nombre">Ciudadano</div>
            </a>
            <a class="seccion-cuadro" href="/policia/">
              <div class="icono">👮</div>
              <div class="nombre">Policía de chicago</div>
            </a>
            <a class="seccion-cuadro" href="/criminal/">
              <div class="icono">🕶️</div>
              <div class="nombre">Criminal</div>
            </a>
            <a class="seccion-cuadro" href="/staff/">
              <div class="icono">🛡️</div>
              <div class="nombre">Staff CHI:RP </div>
            </a>
          </div>
        `;
      }
    }

    cargar();
  </script>
</body>
</html>
