<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chicago Rp</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <div class="marca">
      <img src="/images/logo-header.png" alt="Chicago Rp" />
      <span>Chicago Rp</span>
    </div>
    <nav id="nav-derecha">
      <!-- Se llena con JavaScript segun si hay sesion o no -->
    </nav>
  </header>

  <main>
    <div id="aviso"></div>
    <div id="contenido">
      <!-- Se llena con JavaScript -->
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("acceso") === "denegado") {
      document.getElementById("aviso").innerHTML =
        '<div class="aviso-error">No tienes el rol necesario para ver esa sección.</div>';
    }

    async function cargar() {
      const nav = document.getElementById("nav-derecha");
      const contenido = document.getElementById("contenido");

      let sesion = { loggedIn: false };
      try {
        const res = await fetch("/api/me");
        sesion = await res.json();
      } catch (e) {
        sesion = { loggedIn: false };
      }

      if (!sesion.loggedIn) {
        nav.innerHTML = "";
        contenido.innerHTML = `
          <div class="card">
            <h1>Bienvenido a Chicago Rp</h1>
            <p class="muted">Información general del servidor, normativa y contenido para la comunidad.</p>
            <p>Inicia sesión con tu cuenta de Discord para acceder a tu sección correspondiente.</p>
            <a class="btn" href="/api/login">Iniciar sesión con Discord</a>
          </div>
          <div class="card">
            <h2>Sobre el servidor</h2>
            <p>Aquí va la información general de Chicago Rp: normas básicas, cómo unirse, redes sociales, etc. Este contenido es público, cualquier visitante lo puede ver.</p>
          </div>
        `;
      } else {
        nav.innerHTML = `<a href="/api/logout">Cerrar sesión</a>`;
        contenido.innerHTML = `
          <div class="card centro">
            <h1>Bienvenido, ${sesion.username}</h1>
            <p class="muted">Elige a qué sección quieres entrar.</p>
          </div>
          <div class="secciones-grid">
            <a class="seccion-cuadro" href="/civil/">
              <div class="icono">🧑</div>
              <div class="nombre">Civil</div>
            </a>
            <a class="seccion-cuadro" href="/policia/">
              <div class="icono">👮</div>
              <div class="nombre">Policía</div>
            </a>
            <a class="seccion-cuadro" href="/criminal/">
              <div class="icono">🕶️</div>
              <div class="nombre">Criminal</div>
            </a>
            <a class="seccion-cuadro" href="/staff/">
              <div class="icono">🛡️</div>
              <div class="nombre">Staff</div>
            </a>
          </div>
        `;
      }
    }

    cargar();
  </script>
</body>
</html>
