<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Policía - Chicago Rp</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <div class="marca">
      <img src="/images/logo-header.png" alt="Chicago Rp" />
      <span>Chicago Rp</span>
    </div>
    <nav>
      <a href="/">Inicio</a>
      <a href="/api/logout">Cerrar sesión</a>
    </nav>
  </header>

  <main>
    <div class="card centro">
      <h1>Zona de Policía</h1>
      <p class="muted">Gestiona multas, arrestos y consulta ciudadanos.</p>
    </div>

    <div class="secciones-grid">
      <a class="seccion-cuadro" href="/multas/">
        <div class="icono">💵</div>
        <div class="nombre">Multas</div>
      </a>
      <a class="seccion-cuadro" href="/arrestos/">
        <div class="icono">🚔</div>
        <div class="nombre">Arrestos</div>
      </a>
      <a class="seccion-cuadro" href="/policia/buscar/">
        <div class="icono">🔍</div>
        <div class="nombre">Buscar Ciudadano</div>
      </a>
    </div>
  </main>
</body>
</html>
