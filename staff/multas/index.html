<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrar Multas - Chicago Rp</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <div class="marca">
      <img src="/images/logo-header.png" alt="Chicago Rp" />
      <span>Chicago Rp</span>
    </div>
    <nav>
      <a href="/staff/">Staff</a>
      <a href="/api/logout">Cerrar sesión</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h1>Administrar Multas</h1>
      <p class="muted">Aquí puedes editar o eliminar cualquier multa registrada.</p>
      <input id="buscador" type="text" placeholder="Buscar por nombre de Discord..." />
    </div>

    <div id="lista"></div>
  </main>

  <script>
    async function cargar(buscar) {
      const contenedor = document.getElementById("lista");
      contenedor.innerHTML = '<p class="muted">Cargando...</p>';
      const qs = buscar ? `?buscar=${encodeURIComponent(buscar)}` : "";
      const res = await fetch(`/api/multas${qs}`);
      const multas = await res.json();

      if (!Array.isArray(multas) || !multas.length) {
        contenedor.innerHTML = '<p class="muted">No hay multas.</p>';
        return;
      }

      contenedor.innerHTML = multas
        .map(
          (m) => `
        <div class="card" id="fila-${m.id}">
          <div class="vista">
            <strong>${m.ciudadano}</strong> — ${m.motivo}<br/>
            <span class="muted">Monto: ${m.monto} · Registrada por: ${m.oficial} · ${new Date(m.fecha).toLocaleString()}</span><br/><br/>
            <button class="btn" onclick="mostrarEdicion(${m.id})">Editar</button>
            <button class="btn" style="background:#ef4444; margin-left:8px;" onclick="eliminar(${m.id})">Eliminar</button>
          </div>
          <div class="edicion" style="display:none;">
            <label>Ciudadano</label>
            <input type="text" id="ciudadano-${m.id}" value="${m.ciudadano}" />
            <label>Motivo</label>
            <input type="text" id="motivo-${m.id}" value="${m.motivo}" />
            <label>Monto</label>
            <input type="text" id="monto-${m.id}" value="${m.monto}" />
            <br/><br/>
            <button class="btn" onclick="guardar(${m.id})">Guardar</button>
            <button class="btn" style="background:#2a2e38; margin-left:8px;" onclick="cancelar(${m.id})">Cancelar</button>
          </div>
        </div>
      `
        )
        .join("");
    }

    function mostrarEdicion(id) {
      document.querySelector(`#fila-${id} .vista`).style.display = "none";
      document.querySelector(`#fila-${id} .edicion`).style.display = "block";
    }

    function cancelar(id) {
      document.querySelector(`#fila-${id} .vista`).style.display = "block";
      document.querySelector(`#fila-${id} .edicion`).style.display = "none";
    }

    async function guardar(id) {
      const ciudadano = document.getElementById(`ciudadano-${id}`).value;
      const motivo = document.getElementById(`motivo-${id}`).value;
      const monto = document.getElementById(`monto-${id}`).value;

      await fetch("/api/multas", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, ciudadano, motivo, monto }),
      });

      cargar(document.getElementById("buscador").value.trim());
    }

    async function eliminar(id) {
      if (!confirm("¿Seguro que quieres eliminar esta multa?")) return;
      await fetch(`/api/multas?id=${id}`, { method: "DELETE" });
      cargar(document.getElementById("buscador").value.trim());
    }

    const buscador = document.getElementById("buscador");
    let temporizador;
    buscador.addEventListener("input", () => {
      clearTimeout(temporizador);
      temporizador = setTimeout(() => cargar(buscador.value.trim()), 300);
    });

    cargar("");
  </script>
</body>
</html>
