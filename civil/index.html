<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Civil - Chicago Rp</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <div class="marca">
      <img src="/images/logo-header.png" alt="Chicago Rp" />
      <span>Chicago Rp</span>
    </div>
    <nav>
      <a href="/">Inicio</a>
      <a href="/api/logout">Cerrar sesión</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h1>Zona de Civiles</h1>
      <p class="muted">Solo visible para miembros con rol de Civil (o superior).</p>
      <p>Aquí va el contenido exclusivo para miembros del servidor: normas detalladas, guías,
            </div>

    <div class="card">
      <h2>Tus multas</h2>
      <div id="mis-multas" class="muted">Cargando...</div>
    </div>

    <script>
      async function cargarMisMultas() {
        const contenedor = document.getElementById("mis-multas");
        try {
          const res = await fetch("/api/mis-multas");
          const multas = await res.json();

          if (!Array.isArray(multas) || !multas.length) {
            contenedor.innerHTML = "No tienes multas registradas.";
            return;
          }

          contenedor.innerHTML = multas
            .map(
              (m) => `
              <div class="card" style="margin-bottom:10px;">
                ${m.motivo}<br/>
                <span class="muted">Monto: ${m.monto} · Registrada por: ${m.oficial} · ${new Date(m.fecha).toLocaleString()}</span>
              </div>
            `
            )
            .join("");
        } catch (e) {
          contenedor.innerHTML = "Error al cargar tus multas.";
        }
      }
      cargarMisMultas();
    </script>
    <div class="card">
  <h2>Tus arrestos</h2>
  <div id="mis-arrestos" class="muted">Cargando...</div>
</div>

<script>
  async function cargarMisArrestos() {
    const contenedor = document.getElementById("mis-arrestos");
    try {
      const res = await fetch("/api/mis-arrestos");
      const arrestos = await res.json();

      if (!Array.isArray(arrestos) || !arrestos.length) {
        contenedor.innerHTML = "No tienes arrestos registrados.";
        return;
      }

      contenedor.innerHTML = arrestos
        .map(
          (a) => `
          <div class="card" style="margin-bottom:10px;">
            ${a.motivo}<br/>
            <span class="muted">Tiempo: ${a.tiempo} · Registrado por: ${a.oficial} · ${new Date(a.fecha).toLocaleString()}</span>
          </div>
        `
        )
        .join("");
    } catch (e) {
      contenedor.innerHTML = "Error al cargar tus arrestos.";
    }
  }
  cargarMisArrestos();
</script>
