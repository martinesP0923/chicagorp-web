<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ciudadano - Chicago Rp</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <div class="marca">
      <img src="/images/logo-header.png" alt="Chicago Rp" />
      <span>Chicago Rp</span>
    </div>
    <nav>
      <a href="/">Inicio</a>
      <a href="/api/logout">Cerrar sesión</a>
    </nav>
  </header>

  <main>
    <div class="card centro">
      <h1>Zona de Ciudadano</h1>
      <p class="muted">Gestiona tus trámites y documentos.</p>
    </div>

    <div class="secciones-grid">
      <a class="seccion-cuadro" href="/civil/dni/">
        <div class="icono">🪪</div>
        <div class="nombre">Mi DNI</div>
      </a>
      <a class="seccion-cuadro" href="/civil/multas/">
        <div class="icono">💵</div>
        <div class="nombre">Mis Multas</div>
      </a>
      <a class="seccion-cuadro" href="/civil/arrestos/">
        <div class="icono">🚔</div>
        <div class="nombre">Mis Arrestos</div>
      </a>
    </div>
  </main>
</body>
</html>
