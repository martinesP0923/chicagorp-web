<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Arrestos - Chicago Rp</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <div class="marca">
      <img src="/images/logo-header.png" alt="Chicago Rp" />
      <span>Chicago Rp</span>
    </div>
    <nav>
      <a href="/civil/">Ciudadano</a>
      <a href="/api/logout">Cerrar sesión</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h1>Tus arrestos</h1>
      <div id="mis-arrestos" class="muted">Cargando...</div>
    </div>
  </main>

  <script>
    async function cargarMisArrestos() {
      const contenedor = document.getElementById("mis-arrestos");
      try {
        const res = await fetch("/api/mis-arrestos");
        const arrestos = await res.json();

        if (!Array.isArray(arrestos) || !arrestos.length) {
          contenedor.innerHTML = "No tienes arrestos registrados.";
          return;
        }

        contenedor.innerHTML = arrestos
          .map(
            (a) => `
            <div class="card" style="margin-bottom:10px;">
              ${a.motivo}<br/>
              <span class="muted">Tiempo: ${a.tiempo} · Registrado por: ${a.oficial} · ${new Date(a.fecha).toLocaleString()}</span>
            </div>
          `
          )
          .join("");
      } catch (e) {
        contenedor.innerHTML = "Error al cargar tus arrestos.";
      }
    }
    cargarMisArrestos();
  </script>
</body>
</html>
